# Weekly dependency updates, grouped so each ecosystem opens at most one
# pull request a week (security updates still arrive individually).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # The types follow the Node major that CI and the image run (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    ignore:
      # The build images are the toolchain CI tests with (go.mod, Node 22);
      # moving either is a deliberate change of both together.
      - dependency-name: golang
      - dependency-name: node
