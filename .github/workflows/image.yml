# Builds, scans, signs and publishes ghcr.io/ncecere/chaptarr.
#
# Called by ci.yml after the tests pass:
#   pushes to main   edge, sha-<short>
#   vX.Y.Z tags      vX.Y.Z, vX.Y and latest
#   vX.Y.Z-rc.N      only vX.Y.Z-rc.N (a pre-release never moves vX.Y or latest)
#
# Every action is pinned by commit SHA; the comment gives the version.
name: image
on:
  workflow_call:
    outputs:
      digest:
        description: The pushed multi-arch image's digest (sha256:...)
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore OIDC)
    env:
      IMAGE: ghcr.io/ncecere/chaptarr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          # Tags keep the git tag's "v" (v0.1.0, v0.1); metadata-action's
          # semver patterns drop it. The highest priority tag is also
          # outputs.version, the version built into the binary.
          tags: |
            type=sha,prefix=sha-,format=short,priority=1000,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ github.ref_name }},priority=1000,enable=${{ github.ref_type == 'tag' }}
            type=match,pattern=^(v\d+\.\d+)\.\d+$,group=1,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=chaptarr

      # The build stages run on the runner's architecture and cross-compile
      # (see the Dockerfile), so no emulation is needed.
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must start, and a release image must call itself by its tag.
      - name: Check the built image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          got=$(docker run --rm "${IMAGE}@${DIGEST}" version)
          echo "${got}"
          case "${got}" in
            "chaptarr ${VERSION} ("*) ;;
            *) echo "::error::the image reports '${got}', not ${VERSION}"; exit 1 ;;
          esac
          docker run -d --name smoke -p 8789:8789 "${IMAGE}@${DIGEST}"
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8789/healthz >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8789/api/v1/auth/status
              echo
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container did not answer /healthz within 20 s"
          docker logs smoke
          exit 1

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Signing the digest covers every tag. Only images that passed the scan
      # are signed. The OIDC token request can fail transiently, so retry.
      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for n in 1 2 3 4; do
            cosign sign --yes "${IMAGE}@${DIGEST}" && exit 0
            [ "$n" -lt 4 ] && sleep $((n * 20))
          done
          exit 1

      - name: Job summary
        if: always() && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags:"
            echo
            echo "${TAGS}" | sed 's/^/- /'
            echo
            echo "Verify the signature:"
            echo
            echo '```'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
