<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0e11" />
    <!-- Set the theme before first paint so the page never flashes the wrong one. Keep in sync with src/lib/theme.ts. -->
    <script>
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('chaptarr-theme') || 'system'
        } catch (e) {}
        var light = pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      })()
    </script>
    <style>
      html[data-theme='dark'] { background-color: #0d0e11 }
      html[data-theme='light'] { background-color: #f6f6f8 }
    </style>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23818cf8'/%3E%3Cpath d='M9 19v-3a7 7 0 0 1 14 0v3' fill='none' stroke='%230d0e11' stroke-width='2.5' stroke-linecap='round'/%3E%3Crect x='7.5' y='18' width='5' height='8' rx='2' fill='%230d0e11'/%3E%3Crect x='19.5' y='18' width='5' height='8' rx='2' fill='%230d0e11'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaptarr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
